<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Tarot Cards - Your Fate Awaits</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Digital Tarot Reading</h1>
            <p class="subtitle">Discover your journey through Past, Present, and Future</p>
        </header>

        <!-- Slots for Past, Present, Future -->
        <div class="slots-container">
            <div class="slot" data-slot="past">
                <div class="slot-label">Past</div>
                <div class="slot-area" data-slot-name="past"></div>
            </div>
            <div class="slot" data-slot="present">
                <div class="slot-label">Present</div>
                <div class="slot-area" data-slot-name="present"></div>
            </div>
            <div class="slot" data-slot="future">
                <div class="slot-label">Future</div>
                <div class="slot-area" data-slot-name="future"></div>
            </div>
        </div>

        <!-- Result Display Panel -->
        <div class="result-panel" id="resultPanel">
            <h2>Your Fate</h2>
            <div class="selected-cards" id="selectedCards"></div>
            <div class="fate-sentence" id="fateSentence"></div>
        </div>

        <!-- Card Deck at Bottom -->
        <div class="deck-container">
            <p class="instruction">Drag cards to the slots above to reveal your fate</p>
            <div class="deck" id="deck">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </div>

        <!-- Swap Mode Controls -->
        <div class="swap-controls" id="swapControls">
            <button class="swap-btn" id="swapBtn">Swap Two Cards</button>
            <p class="swap-instruction" id="swapInstruction"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
